<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNILO – Coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --void:#03040b; --deep:#0d1030; --violet:#6b4bff; --ion:#4de1ff; --star:#eaf0ff; --dim:#8d96c9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--void);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;overflow-x:hidden;
  background:var(--void);color:var(--star);
  font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;place-items:center;
}

/* ---------- backdrop ---------- */
.sky{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 110%,#141a4d 0%,var(--deep) 35%,var(--void) 70%)}
.nebula{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.38;
  animation:drift 40s ease-in-out infinite alternate}
.nebula.n1{left:-20vmax;top:-25vmax;background:radial-gradient(circle,var(--violet),transparent 65%)}
.nebula.n2{right:-25vmax;bottom:-20vmax;background:radial-gradient(circle,#1fb6e6,transparent 65%);animation-duration:55s;animation-delay:-12s;opacity:.28}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

.stars{position:absolute;left:0;top:0;width:1px;height:1px;border-radius:50%;
  box-shadow:var(--sh);animation:rise var(--t) linear infinite}
.stars::after{content:"";position:absolute;left:0;top:2400px;width:1px;height:1px;border-radius:50%;box-shadow:var(--sh)}
.s1{--t:160s;color:#fff;opacity:.55}
.s2{--t:105s;width:2px;height:2px;opacity:.8;animation:rise var(--t) linear infinite,twinkle 5s ease-in-out infinite}
.s2::after{width:2px;height:2px}
.s3{--t:70s;width:3px;height:3px;animation:rise var(--t) linear infinite,twinkle 3.2s ease-in-out infinite -1.4s}
.s3::after{width:3px;height:3px}
@keyframes rise{to{transform:translateY(-2400px)}}
@keyframes twinkle{50%{opacity:.25}}

.comet{position:absolute;width:140px;height:1.5px;left:0;top:0;opacity:0;
  background:linear-gradient(90deg,transparent,var(--ion));border-radius:2px;
  transform:rotate(28deg);animation:shoot 11s ease-in infinite}
.comet.c2{animation-delay:5.5s;animation-duration:14s;width:100px;top:20vh}
@keyframes shoot{
  0%{opacity:0;transform:translate(10vw,5vh) rotate(28deg)}
  2%{opacity:1}
  9%{opacity:0;transform:translate(70vw,45vh) rotate(28deg)}
  100%{opacity:0;transform:translate(70vw,45vh) rotate(28deg)}}

.horizon{position:absolute;left:50%;bottom:0;width:180vmax;height:180vmax;border-radius:50%;
  transform:translate(-50%,96%);
  background:radial-gradient(circle,#05061a 62%,#1b2277 63.4%,rgba(77,225,255,.35) 63.8%,transparent 68%);
  box-shadow:0 -2px 60px rgba(77,225,255,.25)}

/* ---------- content ---------- */
main{position:relative;z-index:1;width:100%;max-width:62rem;padding:clamp(1.5rem,5vw,3rem) clamp(1rem,4vw,2rem);
  display:flex;flex-direction:column;align-items:center;text-align:center}

.mark{position:relative;display:grid;place-items:center;padding:clamp(1rem,4vw,2.5rem) 0}
.ring{position:absolute;width:min(92vw,46rem);aspect-ratio:2.6/1;border-radius:50%;
  border:1px dashed rgba(141,150,201,.28);transform:rotate(-8deg);animation:spin 80s linear infinite}
.ring::after{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;border-radius:50%;
  background:var(--ion);box-shadow:0 0 14px 3px var(--ion)}
@keyframes spin{to{transform:rotate(352deg)}}

h1{margin:0;position:relative;font-family:"Unbounded","Arial Black",system-ui,sans-serif;font-weight:900;
  font-size:clamp(3.4rem,17vw,10.5rem);line-height:1;letter-spacing:.06em;margin-right:-.06em;
  color:transparent;
  background:linear-gradient(100deg,#8f7bff 0%,var(--star) 30%,var(--ion) 50%,var(--star) 70%,#8f7bff 100%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;
  animation:sweep 7s ease-in-out infinite;
  filter:drop-shadow(0 0 28px rgba(107,75,255,.55));
  opacity:0;animation:sweep 7s ease-in-out infinite,ignite 1.6s .2s ease-out forwards}
@keyframes sweep{0%,100%{background-position:100% 0}50%{background-position:0% 0}}
@keyframes ignite{from{opacity:0;letter-spacing:.3em;filter:blur(14px)}to{opacity:1;letter-spacing:.06em;filter:drop-shadow(0 0 28px rgba(107,75,255,.55))}}

.soon{margin:clamp(.2rem,1.5vw,.8rem) 0 0;font-weight:300;font-size:clamp(.85rem,2.6vw,1.2rem);
  letter-spacing:.55em;margin-right:-.55em;color:var(--dim);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{color:var(--star)}}

.count{margin:clamp(2.2rem,8vw,4.5rem) 0 0;padding:0;list-style:none;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;max-width:40rem}
.count li{padding:.2rem 0;position:relative}
.count li+li::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:1px;
  background:linear-gradient(transparent,rgba(141,150,201,.4),transparent)}
.num{display:block;font-weight:300;font-variant-numeric:tabular-nums;
  font-size:clamp(1.9rem,8.5vw,3.6rem);line-height:1.1;color:var(--star);
  text-shadow:0 0 22px rgba(77,225,255,.35)}
.num.tick{animation:tick .45s ease-out}
@keyframes tick{from{transform:translateY(-35%);opacity:0}to{transform:none;opacity:1}}
.lbl{display:block;margin-top:.35rem;font-size:clamp(.68rem,2.2vw,.85rem);color:var(--dim);letter-spacing:.14em}

.date{margin:clamp(1.8rem,6vw,3rem) 0 0;font-size:clamp(.78rem,2.2vw,.9rem);color:var(--dim);font-weight:300}

@media (max-width:420px){.soon{letter-spacing:.4em;margin-right:-.4em}.lbl{letter-spacing:.06em}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  h1{opacity:1;background-position:50% 0}
  .comet{display:none}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="nebula n1"></div><div class="nebula n2"></div>
  <div class="stars s1"></div><div class="stars s2"></div><div class="stars s3"></div>
  <div class="comet"></div><div class="comet c2"></div>
  <div class="horizon"></div>
</div>

<main>
  <div class="mark">
    <div class="ring" aria-hidden="true"></div>
    <h1>UNILO</h1>
  </div>
  <p class="soon">coming soon</p>

  <ul class="count" role="timer" aria-label="Time until launch">
    <li><span class="num" id="d">00</span><span class="lbl">days</span></li>
    <li><span class="num" id="h">00</span><span class="lbl">hours</span></li>
    <li><span class="num" id="m">00</span><span class="lbl">minutes</span></li>
    <li><span class="num" id="s">00</span><span class="lbl">seconds</span></li>
  </ul>
  <p class="date" id="date"></p>
</main>

<script>
// Set your launch date/time here (local time of the visitor).
const LAUNCH = new Date("2027-01-01T00:00:00");

// Star fields: random box-shadow points, animated by CSS.
function field(n){
  let out=[];
  for(let i=0;i<n;i++){
    out.push(`${Math.floor(Math.random()*2400)}px ${Math.floor(Math.random()*2400)}px currentColor`);
  }
  return out.join(",");
}
const counts={s1:520,s2:200,s3:60};
const tints={s1:"#ffffff",s2:"#cfd8ff",s3:"#9fe9ff"};
for(const k in counts){
  const el=document.querySelector("."+k);
  el.style.color=tints[k];
  el.style.setProperty("--sh",field(counts[k]));
}

const els={d:document.getElementById("d"),h:document.getElementById("h"),m:document.getElementById("m"),s:document.getElementById("s")};
const pad=n=>String(n).padStart(2,"0");
function set(el,v){
  if(el.textContent!==v){
    el.textContent=v;
    el.classList.remove("tick");void el.offsetWidth;el.classList.add("tick");
  }
}
function update(){
  let diff=Math.max(0,LAUNCH-Date.now());
  const d=Math.floor(diff/864e5); diff%=864e5;
  const h=Math.floor(diff/36e5); diff%=36e5;
  const m=Math.floor(diff/6e4);
  const s=Math.floor(diff%6e4/1e3);
  set(els.d,pad(d));set(els.h,pad(h));set(els.m,pad(m));set(els.s,pad(s));
}
update();setInterval(update,1000);
document.getElementById("date").textContent="Launching "+LAUNCH.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
</script>
</body>
</html>
